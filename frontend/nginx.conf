server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /uploads/ { proxy_pass http://backend:4000/uploads/; }

    # عامل الخدمة والـ manifest بلا تخزين حتى تصل التحديثات فورًا
    location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; default_type application/manifest+json; try_files $uri =404; }
    # ملفات البناء ذات البصمة تُخزَّن طويلًا
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
