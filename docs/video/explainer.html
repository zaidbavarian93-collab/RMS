<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>RMS by Starlight — فيديو تعريفي</title>
<style>
@font-face { font-family: Cairo; font-weight: 400; src: url(assets/fonts/cairo-arabic-400-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 700; src: url(assets/fonts/cairo-arabic-700-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 800; src: url(assets/fonts/cairo-arabic-800-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 900; src: url(assets/fonts/cairo-arabic-900-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 400; src: url(assets/fonts/cairo-latin-400-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: Cairo; font-weight: 700; src: url(assets/fonts/cairo-latin-700-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: Cairo; font-weight: 800; src: url(assets/fonts/cairo-latin-800-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: Cairo; font-weight: 900; src: url(assets/fonts/cairo-latin-900-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: Plex; font-weight: 400; src: url(assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: Plex; font-weight: 600; src: url(assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: Plex; font-weight: 400; src: url(assets/fonts/ibm-plex-sans-arabic-latin-400-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: Plex; font-weight: 600; src: url(assets/fonts/ibm-plex-sans-arabic-latin-600-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }

:root { --bg: #060b18; --ink: #eef2fa; --soft: #9fb0c8; --gold: #ffb547; --cyan: #38bdf8; --violet: #8b6cff; --green: #34d399; --red: #ff5d6c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: Cairo, sans-serif; color: var(--ink); }

#bg { position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(900px 600px at var(--gx, 30%) var(--gy, 30%), rgba(56, 120, 248, .20), transparent 70%),
    radial-gradient(800px 500px at calc(100% - var(--gx, 30%)) calc(100% - var(--gy, 30%)), rgba(139, 108, 255, .16), transparent 70%),
    var(--bg); }
#grid { position: absolute; inset: -200px;
  background-image: linear-gradient(rgba(120, 160, 255, .075) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 160, 255, .075) 1px, transparent 1px);
  background-size: 80px 80px; }
#floor { position: absolute; left: -50%; right: -50%; bottom: -40%; height: 90%; transform-origin: 50% 0;
  transform: perspective(900px) rotateX(72deg);
  background-image: linear-gradient(rgba(56, 189, 248, .22) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(56, 189, 248, .22) 1.5px, transparent 1.5px);
  background-size: 120px 120px; opacity: 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%); }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .55)); }
#stage { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 50%; }

/* هوية ستارلايت في الخلفية: سماء نجوم + شبكة كوكبة حيّة + شعار S الكبير */
#sky { position: absolute; inset: 0; }
#mark { position: absolute; height: 1180px; left: 50%; top: 50%; margin: -590px 0 0 -455px; opacity: .08; mix-blend-mode: screen; filter: saturate(1.2); }
#word { position: absolute; left: 64px; bottom: 44px; height: 74px; filter: brightness(0) invert(1); opacity: .6; }

/* مؤثر الانتقال الرقمي: شعاع ضوء يمسح الشاشة مع شرائح بيانات */
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#beam { position: absolute; top: -10%; height: 120%; width: 260px; opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(139, 108, 255, .35) 25%, rgba(56, 189, 248, .75) 45%, #fff 50%, rgba(255, 181, 71, .75) 55%, rgba(139, 108, 255, .3) 75%, transparent);
  filter: blur(6px); mix-blend-mode: screen; transform: skewX(-12deg); }
#fx .slice { position: absolute; height: 3px; border-radius: 2px; opacity: 0; mix-blend-mode: screen; }
.scene { position: absolute; inset: 0; opacity: 0; }
.abs { position: absolute; }

/* شارة أعلى الشاشة */
#hud { position: absolute; top: 48px; right: 64px; left: 64px; display: flex; justify-content: space-between; align-items: center; font: 600 22px/1 Plex, sans-serif; color: var(--soft); letter-spacing: .5px; }
#hud .tag { display: flex; gap: 14px; align-items: center; }
#hud .dot { height: 46px; filter: drop-shadow(0 0 10px rgba(139, 108, 255, .6)); }
#hud .bar { position: absolute; left: 0; right: 0; bottom: -16px; height: 2px; background: rgba(255, 255, 255, .08); }
#hud .bar i { position: absolute; right: 0; top: 0; bottom: 0; background: linear-gradient(270deg, var(--gold), var(--violet)); }
#hud .time { font-family: Plex; direction: ltr; }

/* الطباعة الحركية */
.kt { font-weight: 900; line-height: 1.25; text-align: center; white-space: nowrap; }
.kt .w { display: inline-block; margin: 0 .14em; will-change: transform, opacity, filter; }
.hl { color: var(--gold); text-shadow: 0 0 28px rgba(255, 181, 71, .55); }
.hc { color: var(--cyan); text-shadow: 0 0 28px rgba(56, 189, 248, .5); }
.glow { text-shadow: 0 0 30px rgba(140, 180, 255, .35); }
.sub { font: 400 34px/1.6 Plex, sans-serif; color: var(--soft); text-align: center; }
.eyebrow { font: 600 26px/1 Plex, sans-serif; color: var(--cyan); letter-spacing: 1px; }

.box { background: rgba(14, 24, 48, .78); border: 1.5px solid rgba(120, 160, 255, .28); border-radius: 22px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .02) inset, 0 20px 60px rgba(0, 0, 0, .45); }
.chip { display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px; font: 700 34px/1 Cairo; background: rgba(14, 24, 48, .85); border: 1.5px solid rgba(255, 181, 71, .45); box-shadow: 0 0 30px rgba(255, 181, 71, .15); white-space: nowrap; }
.chip.c { border-color: rgba(56, 189, 248, .5); box-shadow: 0 0 30px rgba(56, 189, 248, .18); }
.node { position: absolute; width: 270px; padding: 26px 18px; text-align: center; }
.node b { display: block; font: 800 36px/1.3 Cairo; }
.node small { display: block; margin-top: 8px; font: 400 23px/1.4 Plex; color: var(--soft); }

.win { position: absolute; border-radius: 18px; overflow: hidden; background: #0b1428; border: 1.5px solid rgba(120, 160, 255, .35); box-shadow: 0 40px 120px rgba(0, 0, 0, .6), 0 0 80px rgba(56, 120, 248, .18); }
.win .bar { height: 40px; display: flex; gap: 10px; align-items: center; padding: 0 18px; background: rgba(255, 255, 255, .04); border-bottom: 1px solid rgba(255, 255, 255, .06); direction: ltr; }
.win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; }
.win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
.win img { display: block; width: 100%; }

.phone { position: absolute; width: 330px; border-radius: 46px; border: 12px solid #0b1020; background: #0b1020; overflow: hidden; box-shadow: 0 40px 100px rgba(0, 0, 0, .6), 0 0 0 2px rgba(120, 160, 255, .3), 0 0 70px rgba(139, 108, 255, .25); }
.phone img { display: block; width: 100%; }
.plabel { position: absolute; width: 330px; text-align: center; font: 700 32px/1 Cairo; }

.row { position: absolute; right: 0; left: 0; height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 1px solid rgba(255, 255, 255, .07); font: 600 32px/1 Plex; }
.pill { padding: 10px 24px; border-radius: 999px; font: 700 26px/1 Cairo; border: 1.5px solid rgba(255, 255, 255, .15); color: var(--soft); }
.pill.on { color: #052e1f; background: var(--green); border-color: var(--green); box-shadow: 0 0 22px rgba(52, 211, 153, .55); }
.pill.off { color: #fff; background: var(--red); border-color: var(--red); box-shadow: 0 0 22px rgba(255, 93, 108, .5); }
svg { overflow: visible; }
</style>
</head>
<body>
<script>{ const c = new URLSearchParams(location.search).get('cut'); document.write(`<script src="timing${c ? '-' + c : ''}.js"><\/script>`); }</script>
<div id="bg"><div id="grid"></div><div id="floor"></div><canvas id="sky" width="1920" height="1080"></canvas><img id="mark" src="assets/img/logo-mark.png"></div>
<div id="stage"></div>
<div id="fx"><div id="beam"></div></div>
<div id="vignette"></div>
<img id="word" src="assets/img/logo-word.png">
<div id="hud"><span class="tag"><img class="dot" src="assets/img/logo-mark.png"><span>RMS · STARLIGHT</span></span><span class="time" id="clock">00:00</span><span class="bar"><i id="prog"></i></span></div>

<script>
// ===== أدوات الحركة =====
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const E = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  inOut: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
  lin: (x) => x,
};
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;
function st(el, o) {
  const tf = [];
  if (o.x != null || o.y != null) tf.push(`translate(${o.x || 0}px, ${o.y || 0}px)`);
  if (o.z != null) tf.push(`translateZ(${o.z}px)`);
  if (o.ry != null) tf.push(`rotateY(${o.ry}deg)`);
  if (o.rx != null) tf.push(`rotateX(${o.rx}deg)`);
  if (o.r != null) tf.push(`rotate(${o.r}deg)`);
  if (o.s != null) tf.push(`scale(${o.s})`);
  el.style.transform = tf.join(' ');
  if (o.o != null) el.style.opacity = o.o;
  if (o.blur != null) el.style.filter = o.blur > .05 ? `blur(${o.blur}px)` : 'none';
}
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

// نص حركي: كل كلمة تظهر بالتتابع مع صعود وإزالة ضبابية. الكلمات بين [[ ]] تُبرز ذهبيًا و{{ }} سماويًا
function kinetic(text, size, cls = '') {
  const el = h(`<div class="kt abs ${cls}" style="font-size:${size}px"></div>`);
  text.split(' ').forEach((raw) => {
    let w = raw, c = '';
    if (/^\[\[.*\]\]$/.test(raw)) { w = raw.slice(2, -2); c = 'hl'; }
    if (/^\{\{.*\}\}$/.test(raw)) { w = raw.slice(2, -2); c = 'hc'; }
    el.appendChild(h(`<span class="w ${c}">${w}</span>`));
  });
  return el;
}
function revealWords(el, t, start, stagger = .12, dur = .5) {
  [...el.children].forEach((w, i) => {
    const k = P(t, start + i * stagger, start + i * stagger + dur);
    st(w, { o: k, y: (1 - k) * 40, blur: (1 - k) * 12 });
  });
}
function center(el, y, w = 1920) { el.style.top = y + 'px'; el.style.left = (1920 - w) / 2 + 'px'; el.style.width = w + 'px'; }

// ===== المشاهد =====
const stage = document.getElementById('stage');
const scenes = [];
// توقيت المشاهد من timing.js (يولّده mix.py من أطوال مقاطع التعليق الصوتي)
const ROWS = window.TIMING.rows;
// حركات كل مشهد مصمَّمة على مدة أساسية (BASE) وتُمدّ أو تُضغط بنسبة مدته الفعلية المضبوطة على طول التعليق الصوتي
const BASE = [6.4, 7.6, 10, 9.6, 10, 9.4, 8.8, 10.4, 8.8, 8.8, 10, 5.6, 9.6];
let built = 0; // رقم المشهد التالي في الترتيب الكامل؛ النسخ المختصرة تتخطى ما ليس في ROWS
function scene(build) {
  const n = built++, row = ROWS.find((r) => (r.scene ?? n) === n);
  if (!row) return;
  const { start, dur } = row;
  const root = h('<div class="scene"></div>');
  stage.appendChild(root);
  const base = BASE[n];
  const update = build(root, base);
  scenes.push({ start, dur, root, update, k: base / dur });
}

// 1) الافتتاح
scene((r) => {
  const a = kinetic('ماذا لو', 120, 'glow'); center(a, 300); r.appendChild(a);
  const b = kinetic('أدرت مطعمك [[كلّه]]', 150, 'glow'); center(b, 450); r.appendChild(b);
  const c = kinetic('من {{شاشة}} {{واحدة؟}}', 120, 'glow'); center(c, 650); r.appendChild(c);
  const line = h('<div class="abs" style="top:830px;height:4px;left:660px;width:600px;background:linear-gradient(270deg,var(--gold),var(--violet));border-radius:4px;transform-origin:right"></div>');
  r.appendChild(line);
  return (t) => {
    revealWords(a, t, .3); revealWords(b, t, 1.1, .18, .6); revealWords(c, t, 2.5, .2);
    st(line, { o: P(t, 3.3, 3.9) }); line.style.transform = `scaleX(${P(t, 3.3, 4.3, E.inOut)})`;
  };
});

// 2) الشعار
scene((r) => {
  const mark = h('<img class="abs" src="assets/img/logo-mark.png" style="width:230px;left:845px;top:150px">'); r.appendChild(mark);
  const halo = h('<div class="abs" style="left:760px;top:120px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,255,.45),transparent 65%)"></div>'); r.insertBefore(halo, mark);
  const rms = h('<div class="abs kt" style="font-size:220px;direction:ltr;letter-spacing:18px;top:440px;left:0;width:1920px"><span class="w">R</span><span class="w">M</span><span class="w">S</span></div>'); r.appendChild(rms);
  const by = h('<div class="abs" style="top:715px;left:0;width:1920px;text-align:center;direction:ltr;font:800 58px/1 Cairo;background:linear-gradient(90deg,var(--violet),var(--cyan) 55%,var(--gold));-webkit-background-clip:text;color:transparent">by Starlight</div>'); r.appendChild(by);
  const sub = kinetic('نظام إدارة المطاعم المتكامل', 56); center(sub, 820); sub.style.fontWeight = 700; sub.style.color = 'var(--soft)'; r.appendChild(sub);
  return (t) => {
    const k = P(t, .2, 1.2, E.back);
    st(mark, { o: P(t, .2, .8), s: lerp(.4, 1, k), r: (1 - k) * -40 });
    st(halo, { o: P(t, .3, 1.4) * (.75 + .25 * Math.sin(t * 3)), s: .8 + .2 * P(t, .3, 1.4) });
    [...rms.children].forEach((c, i) => { const q = P(t, 1 + i * .15, 1.6 + i * .15, E.back); st(c, { o: q, y: (1 - q) * 80, s: lerp(1.6, 1, q), blur: (1 - q) * 16 }); });
    st(by, { o: P(t, 1.9, 2.6), y: (1 - P(t, 1.9, 2.6)) * 30 });
    revealWords(sub, t, 2.6, .14);
  };
});

// 3) المشكلة
scene((r) => {
  const title = kinetic('وداعًا لـ', 110, 'glow'); center(title, 170); r.appendChild(title);
  const items = ['الطلبات الورقية الضائعة', 'الصياح بين الصالة والمطبخ', 'حسابات آخر الليل اليدوية', 'مخزون لا تعرف ما تبقّى منه'];
  const pos = [[960, 400], [330, 470], [1010, 640], [280, 720]];
  const chips = items.map((t, i) => { const c = h(`<div class="chip abs" style="font-size:44px;padding:24px 40px;left:${pos[i][0]}px;top:${pos[i][1]}px">${t}<span class="abs strike" style="right:30px;left:30px;top:50%;height:5px;background:var(--gold);box-shadow:0 0 18px var(--gold);transform-origin:right;border-radius:3px"></span></div>`); r.appendChild(c); return c; });
  return (t) => {
    revealWords(title, t, .2, .15);
    chips.forEach((c, i) => {
      const a = .9 + i * 1.6; const k = P(t, a, a + .6, E.back);
      st(c, { o: P(t, a, a + .4), s: lerp(.6, 1, k), y: Math.sin(t * 1.4 + i) * 8 });
      const s = c.querySelector('.strike'); s.style.transform = `translateY(-50%) scaleX(${P(t, 7.4 + i * .35, 7.9 + i * .35, E.inOut)})`;
      c.style.color = P(t, 7.6 + i * .35, 8.1 + i * .35) > .5 ? 'rgba(238,242,250,.45)' : 'var(--ink)';
    });
  };
});

// 4) رحلة الطلب
scene((r) => {
  const title = kinetic('رحلة الطلب في [[نظام]] [[واحد]]', 84, 'glow'); center(title, 150); r.appendChild(title);
  const nodes = [['الكابتن', 'عند الطاولة', '🧑‍🍳'], ['المطبخ', 'شاشة الطلبات', '🔥'], ['الكاشير', 'الدفع والفاتورة', '🧾'], ['التقارير', 'لحظة بلحظة', '📊']];
  nodes[0][2] = '📱';
  const X = [1530, 1110, 690, 270];
  const svg = h('<svg class="abs" width="1920" height="1080" style="left:0;top:0"><path id="hp" d="M1530 540 L270 540" stroke="url(#g1)" stroke-width="4" fill="none" stroke-linecap="round"/><defs><linearGradient id="g1" x1="1" x2="0"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#8b6cff"/></linearGradient></defs><circle id="hd" r="12" fill="#ffb547" style="filter:drop-shadow(0 0 12px #ffb547)"/></svg>');
  r.appendChild(svg);
  const els = nodes.map(([b, s, ic], i) => { const n = h(`<div class="node box" style="left:${X[i] - 150}px;top:410px;width:300px"><div style="font-size:54px;line-height:1;margin-bottom:10px">${ic}</div><b>${b}</b><small>${s}</small></div>`); if (i === 3) n.style.borderColor = 'rgba(255,181,71,.7)'; r.appendChild(n); return n; });
  const cap = kinetic('بلا ورق، بلا صياح، {{بلا}} {{انتظار}}', 46); center(cap, 790); cap.style.fontWeight = 700; r.appendChild(cap);
  const path = svg.querySelector('#hp'), dot = svg.querySelector('#hd'); const L = 1260;
  path.style.strokeDasharray = L;
  return (t) => {
    revealWords(title, t, .2, .12);
    const k = P(t, 1, 7.4, E.inOut); path.style.strokeDashoffset = L * (1 - k);
    dot.setAttribute('cx', 1530 - L * k); dot.setAttribute('cy', 540); dot.style.opacity = k > 0 && k < 1 ? 1 : 0;
    els.forEach((n, i) => { const a = 1 + i * 2.05; const q = P(t, a, a + .6, E.back); st(n, { o: P(t, a, a + .4), s: lerp(.5, 1, q), y: (1 - q) * 30 }); });
    revealWords(cap, t, 8, .1);
  };
});

// مشهد بنمط "لقطة شاشة + عنوان + ملاحظات جانبية"
function shotScene({ eyebrow, title, img, chips }) {
  scene((r, base) => {
    const eb = h(`<div class="abs eyebrow" style="top:150px;right:120px">${eyebrow}</div>`); r.appendChild(eb);
    const tt = kinetic(title, 76, 'glow'); tt.style.top = '190px'; tt.style.right = '120px'; tt.style.textAlign = 'right'; r.appendChild(tt);
    const win = h(`<div class="win" style="left:110px;top:330px;width:1080px"><div class="bar"><i></i><i></i><i></i></div><img src="assets/img/${img}"></div>`); r.appendChild(win);
    win.style.height = '640px';
    const cs = chips.map((c, i) => { const el = h(`<div class="chip abs ${i % 2 ? 'c' : ''}" style="right:120px;top:${400 + i * 150}px">${c}</div>`); r.appendChild(el); return el; });
    return (t) => {
      st(eb, { o: P(t, .1, .5) });
      revealWords(tt, t, .2, .12);
      const k = P(t, .4, 1.6, E.out);
      st(win, { o: P(t, .4, 1), x: (1 - k) * -260, ry: lerp(-28, -10, k) + Math.sin(t * .6) * 2, rx: 4, s: lerp(.9, 1, k) });
      win.querySelector('img').style.transform = `translateY(${-P(t, 2, base - .5, E.inOut) * 60}px)`;
      cs.forEach((c, i) => { const a = 2 + i * 2.2; const q = P(t, a, a + .6, E.back); st(c, { o: P(t, a, a + .3), x: (1 - q) * 120, s: lerp(.8, 1, q) }); });
    };
  });
}

// 5) الكابتن
shotScene({ eyebrow: 'الصالة', title: 'الطاولات [[أمام]] [[عينيك]]', img: 'captain-map.jpg', chips: ['خريطة طاولات بألوان حالتها', 'الطلب من الجوال إلى المطبخ', 'يعمل حتى بدون إنترنت'] });

const rnd = ((a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261014);
const BRAND = ['#8b6cff', '#38bdf8', '#ffb547'];
const STARS = Array.from({ length: 260 }, () => ({ x: rnd() * 2400, y: rnd() * 1080, r: .4 + rnd() * 1.4, ph: rnd() * 6.3, sp: .5 + rnd() * 2, d: .2 + rnd() * .8 }));
const SPARK = Array.from({ length: 9 }, (_, i) => ({ x: rnd() * 2400, y: 80 + rnd() * 920, s: 8 + rnd() * 14, ph: rnd() * 6.3, c: BRAND[i % 3] }));
const NODES = Array.from({ length: 38 }, (_, i) => ({ x: rnd() * 2600 - 340, y: rnd() * 1180 - 50, ax: 20 + rnd() * 50, ay: 15 + rnd() * 40, f: .05 + rnd() * .12, ph: rnd() * 6.3, c: BRAND[i % 3] }));
const EDGES = [];
NODES.forEach((a, i) => NODES.forEach((b, j) => { if (j > i && Math.hypot(a.x - b.x, a.y - b.y) < 330) EDGES.push([i, j, rnd()]); }));
const SLICES = Array.from({ length: 9 }, (_, i) => { const el = document.createElement('div'); el.className = 'slice'; fx.appendChild(el);
  return { el, y: 90 + rnd() * 900, w: 180 + rnd() * 520, off: rnd(), c: BRAND[i % 3] }; });

// سماء ستارلايت: نجوم تتلألأ + نجوم رباعية كشعار ستارلايت + كوكبة نقاط متصلة تسري فيها نبضات بيانات
function drawSky(t, pan, boost) {
  sky.clearRect(0, 0, 1920, 1080);
  for (const s of STARS) {
    const x = ((s.x - t * 6 * s.d - pan * .25 * s.d) % 2400 + 2400) % 2400 - 240;
    sky.globalAlpha = (.25 + .55 * (.5 + .5 * Math.sin(t * s.sp + s.ph))) * s.d;
    sky.fillStyle = '#dfe8ff'; sky.beginPath(); sky.arc(x, s.y, s.r, 0, 6.283); sky.fill();
  }
  const P2 = NODES.map((n) => ({ x: n.x + n.ax * Math.sin(t * n.f * 6.283 + n.ph) - pan * .45, y: n.y + n.ay * Math.cos(t * n.f * 5 + n.ph), c: n.c }));
  sky.lineWidth = 1.4;
  for (const [i, j, r] of EDGES) {
    const a = P2[i], b = P2[j]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (d > 360) continue;
    const al = (1 - d / 360) * (.16 + .3 * boost);
    sky.globalAlpha = al; sky.strokeStyle = a.c; sky.beginPath(); sky.moveTo(a.x, a.y); sky.lineTo(b.x, b.y); sky.stroke();
    // نبضة بيانات تسري على بعض الخطوط
    if (r < .45) { const k = (t * (.25 + r) + r * 7) % 1; sky.globalAlpha = Math.min(1, al * 4) * Math.sin(Math.PI * k);
      sky.fillStyle = '#fff'; sky.beginPath(); sky.arc(lerp(a.x, b.x, k), lerp(a.y, b.y, k), 2.4, 0, 6.283); sky.fill(); }
  }
  for (const p of P2) {
    const g = sky.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16); g.addColorStop(0, '#fff'); g.addColorStop(.3, p.c); g.addColorStop(1, 'rgba(0,0,0,0)');
    sky.globalAlpha = .45 + .4 * boost; sky.fillStyle = g; sky.beginPath(); sky.arc(p.x, p.y, 16, 0, 6.283); sky.fill();
  }
  for (const s of SPARK) {
    const x = ((s.x - t * 10 - pan * .6) % 2400 + 2400) % 2400 - 240; const k = .5 + .5 * Math.sin(t * 1.3 + s.ph); const z = s.s * (.7 + .5 * k);
    sky.globalAlpha = .35 + .5 * k; sky.fillStyle = s.c;
    sky.beginPath(); sky.moveTo(x, s.y - z); sky.quadraticCurveTo(x, s.y, x + z, s.y); sky.quadraticCurveTo(x, s.y, x, s.y + z); sky.quadraticCurveTo(x, s.y, x - z, s.y); sky.quadraticCurveTo(x, s.y, x, s.y - z); sky.fill();
  }
  sky.globalAlpha = 1;
}

window.seek = (t) => {
  let tr = 0, pan = 0; // tr: تقدّم الانتقال الجاري (0..1)، pan: إزاحة تراكمية للخلفية مع كل انتقال
  scenes.forEach((s, i) => {
    if (i > 0) { const q = clamp((t - s.start) / OVER); pan += E.inOut(q) * 700; if (q > 0 && q < 1) tr = q; }
    const lt = t - s.start;
    const vis = lt > -0.01 && lt < s.dur;
    if (!vis) { s.root.style.opacity = 0; s.root.style.display = 'none'; return; }
    s.root.style.display = 'block';
    // كاروسيل ثلاثي الأبعاد: المشهد الجديد يدخل من اليسار والقديم يدور خارجًا نحو اليمين (اتجاه القراءة العربية)
    const kin = i === 0 ? 1 : E.inOut(clamp(lt / OVER));
    const kout = i === scenes.length - 1 ? 0 : E.inOut(clamp((lt - (s.dur - OVER)) / OVER));
    const q = kin < 1 ? -(1 - kin) : kout; // سالب أثناء الدخول، موجب أثناء الخروج
    const push = 1 + 0.035 * (lt / s.dur);
    let o = clamp(1 - Math.abs(q) * 1.15);
    if (i === 0) o *= clamp(lt / .6);
    if (i === scenes.length - 1) o *= clamp((s.dur - lt) / 1);
    s.root.style.opacity = o;
    s.root.style.transform = `translateX(${q * 1250}px) translateZ(${-Math.abs(q) * 650}px) rotateY(${q * 42}deg) scale(${push})`;
    s.root.style.filter = Math.abs(q) > .01 ? `blur(${Math.abs(q) * 3}px) brightness(${1 + Math.abs(q) * .4})` : 'none';
    s.update(lt * s.k);
  });
  // شعاع الضوء وشرائح البيانات أثناء الانتقال
  const fl = Math.sin(Math.PI * tr);
  beam.style.opacity = fl; beam.style.left = lerp(-400, 2100, E.inOut(tr)) + 'px';
  SLICES.forEach((sl, i) => { const k = clamp(tr * 1.4 - sl.off * .4); sl.el.style.top = sl.y + 'px'; sl.el.style.width = sl.w + 'px';
    sl.el.style.left = lerp(-sl.w, 1920, k) + 'px'; sl.el.style.opacity = Math.sin(Math.PI * k) * .9;
    sl.el.style.background = `linear-gradient(90deg, transparent, ${sl.c}, #fff)`; sl.el.style.boxShadow = `0 0 14px ${sl.c}`; });
  // شعار S الكبير: يتنفّس ببطء ويتوهّج مع كل انتقال
  st(mark, { x: Math.sin(t * .07) * 40 - fl * 60, r: Math.sin(t * .05) * 4, s: 1 + .03 * Math.sin(t * .2) + fl * .06, o: .085 + fl * .2 });
  drawSky(t, pan, fl);
  // كاميرا: انجراف بطيء للشبكة والإضاءة
  grid.style.transform = `translate(${(t * 14 + pan * .3) % 80}px, ${(t * 6) % 80}px) rotate(${Math.sin(t * .1) * 1.5}deg)`;
  bg.style.setProperty('--gx', 30 + 25 * Math.sin(t * .13) + '%'); bg.style.setProperty('--gy', 35 + 20 * Math.cos(t * .11) + '%');
  const f = FLOOR.reduce((m, [a, b]) => Math.max(m, Math.min(clamp((t - a) / .8), clamp((b - t) / .8))), 0);
  floor.style.opacity = f * .9;
  floor.style.backgroundPosition = `${-pan * .5}px ${(t * 60) % 120}px`;
  const s = Math.floor(t); clock.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  prog.style.width = (t / TOTAL) * 100 + '%';
  hud.style.opacity = clamp(t / 1) * clamp((TOTAL - t) / 1);
  document.getElementById('word').style.opacity = .6 * clamp(t / 1) * clamp((TOTAL - t) / 1);
};
window.TOTAL = TOTAL;
window.seek(0);
</script>
